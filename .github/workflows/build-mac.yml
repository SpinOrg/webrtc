name: Build and Release WebRTC (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            cmake_arch: amd64
          - runner: macos-15
            arch: arm64
            cmake_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          DEPOT_TOOLS_DIR="${RUNNER_TEMP}/depot_tools"
          if [[ ! -d "${DEPOT_TOOLS_DIR}" ]]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${DEPOT_TOOLS_DIR}"
          fi
          # Initialize depot_tools python/toolchain files required by gn/gclient.
          PATH="${DEPOT_TOOLS_DIR}:${PATH}" "${DEPOT_TOOLS_DIR}/update_depot_tools"
          # WebRTC checkout places the real gn binary here after gclient sync/hooks.
          WEBRTC_GN_DIR="${GITHUB_WORKSPACE}/build/webrtc/src/webrtc-build/webrtc/src/buildtools/mac"
          echo "DEPOT_TOOLS_DIR=${DEPOT_TOOLS_DIR}" >> "${GITHUB_ENV}"
          echo "PATH=${DEPOT_TOOLS_DIR}:${WEBRTC_GN_DIR}:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Verify depot_tools
        shell: bash
        run: |
          set -euo pipefail
          command -v gclient
          gclient help > /dev/null
          which -a gn || true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARCH=${{ matrix.cmake_arch }} -DDEPOT_TOOLS_PATH="${DEPOT_TOOLS_DIR}"

      - name: Build pack target
        run: cmake --build build --target pack --parallel 2

      - name: Normalize artifact name
        shell: bash
        run: |
          set -euo pipefail
          SRC="build/dist/webrtc-darwin-${{ matrix.cmake_arch }}-release.zip"
          DST="build/dist/webrtc-darwin-${{ matrix.arch }}-release.zip"
          if [[ ! -f "$SRC" ]]; then
            echo "Expected artifact not found: $SRC"
            ls -la build/dist || true
            exit 1
          fi
          cp "$SRC" "$DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-macos-${{ matrix.arch }}
          path: build/dist/webrtc-darwin-${{ matrix.arch }}-release.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
